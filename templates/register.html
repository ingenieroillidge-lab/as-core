<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta Gratis - AS PLATFORM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030308;
            --card-bg: rgba(15, 23, 42, 0.6);
            --accent-cyan: #38bdf8;
            --accent-purple: #a855f7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Ambient background glow */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(80px);
        }

        .register-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3rem;
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .error {
            color: #fb7185;
            background: rgba(251, 113, 133, 0.1);
            border: 1px solid rgba(251, 113, 133, 0.2);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 0.85rem 1.1rem;
            border-radius: 14px;
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }

        select option {
            background-color: #0d1117;
            color: white;
        }

        button {
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: #030712;
            font-weight: 700;
            padding: 1.1rem;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(56, 189, 248, 0.5);
            opacity: 0.95;
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .login-link a {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="register-card">
        <div class="logo">AS PLATFORM</div>
        <div class="subtitle">Regístrate gratis hoy y desbloquea el análisis de rentabilidad real de tu negocio.</div>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="business_name">Nombre de tu Negocio</label>
                <input type="text" id="business_name" name="business_name" placeholder="Ej: Hamburguesas El Corral" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="operation_type">Tipo de Operación</label>
                <select id="operation_type" name="operation_type">
                    <option value="PRODUCCIÓN">Producción (Restaurantes, fritos, alimentos)</option>
                    <option value="REVENTA">Reventa (Tiendas, minimarket, ropa)</option>
                    <option value="SERVICIOS">Servicios (Gimnasios, barberías, consultoría)</option>
                    <option value="HÍBRIDO" selected>Híbrido (Mezcla de stock y procesos)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Usuario Administrador</label>
                <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit">🚀 Crear cuenta y empezar gratis</button>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="/login">Iniciar sesión</a>
        </div>
    </div>
</body>
</html>
