<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - AS PLATFORM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .super-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        .status-pill { padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        .status-activo { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .status-suspendido { background: rgba(251, 113, 133, 0.2); color: #fb7185; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">AS PLATFORM <span style="font-size: 0.6rem; color: #fb7185;">SUPER ADMIN</span></div>
        <ul class="nav-links">
            <li><a href="/logout">Cerrar Sesión Maestra</a></li>
        </ul>
    </nav>

    <main>
        <div class="header">
            <h1>Panel de Mando Global</h1>
            <p style="color: var(--text-secondary)">Bienvenido, Samuel. Aquí controlas todas las instancias de AS Solutions.</p>
        </div>

        <div class="super-grid">
            <div class="card">
                <h3>Registrar Nueva Empresa</h3>
                <form id="form-nuevo-negocio" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label>Nombre de la Empresa</label>
                        <input type="text" id="n-nombre" placeholder="Ej: Pollos El Rey" required>
                    </div>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Plan</label>
                        <select id="n-plan">
                            <option value="FREE">Gratuito (Limitado)</option>
                            <option value="PRO">Profesional (Full)</option>
                            <option value="ENTERPRISE">Enterprise</option>
                        </select>
                    </div>
                    <hr style="margin: 1.5rem 0; opacity: 0.1;">
                    <h4>Usuario Administrador Inicial</h4>
                    <div class="form-group"><label>Username</label><input type="text" id="n-admin-user" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="n-admin-pass" required></div>
                    <button type="submit" style="margin-top: 2rem; width: 100%; background: #38bdf8; color: black; font-weight: 800;">Activar Nueva Instancia</button>
                </form>
            </div>

            <div class="card">
                <h3>Empresas en la Plataforma</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Empresa</th>
                                <th>Plan</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="lista-negocios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadNegocios() {
            const res = await fetch('/api/super/negocios');
            const data = await res.json();
            const tbody = document.getElementById('lista-negocios');
            tbody.innerHTML = data.map(n => `
                <tr>
                    <td><strong>${n.nombre}</strong></td>
                    <td>${n.plan}</td>
                    <td><span class="status-pill status-${n.status.toLowerCase()}">${n.status}</span></td>
                    <td><button style="background: none; border: 1px solid #333; font-size: 0.7rem;">Gestionar</button></td>
                </tr>
            `).join('');
        }

        document.getElementById('form-nuevo-negocio').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('n-nombre').value,
                plan: document.getElementById('n-plan').value,
                admin_user: document.getElementById('n-admin-user').value,
                admin_pass: document.getElementById('n-admin-pass').value
            };
            const res = await fetch('/api/super/negocios', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('¡Instancia activada!');
                e.target.reset();
                loadNegocios();
            }
        };

        window.onload = loadNegocios;
    </script>
</body>
</html>
