name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Sintaxis
        run: python -m compileall -q app.py database.py services tests
      - name: Pruebas del contrato y de seguridad (base temporal, sin tocar datos reales)
        run: python -m unittest discover -s tests -p "test_suite.py" -v
